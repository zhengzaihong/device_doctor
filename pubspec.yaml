name: device_doctor
description: "跨平台设备环境检测：模拟器/虚拟机、代理/VPN、Root/越狱、签名与设备信息。Android 深度检测 + iOS/Windows/macOS/Linux/Web Dart 回退。"
version: 1.0.0
homepage: https://github.com/zhengzaihong/device_doctor
repository: https://github.com/zhengzaihong/device_doctor
issue_tracker: https://github.com/zhengzaihong/device_doctor/issues
topics:
  - device
  - emulator
  - vpn
  - proxy
  - root

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zzh.device_doctor
        pluginClass: DeviceDoctorPlugin
      ios:
        pluginClass: DeviceDoctorPlugin
      windows:
        dartPluginClass: DeviceDoctorWindows
      linux:
        dartPluginClass: DeviceDoctorLinux
      macos:
        dartPluginClass: DeviceDoctorMacOS
