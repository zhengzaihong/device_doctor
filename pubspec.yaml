name: android_work
description: "Android 真机/模拟器、Root、代理/VPN、APK 签名与设备信息检测的 Flutter 插件（风控组件）。"
version: 0.2.0
homepage: https://github.com/zhengzaihong/android_work
repository: https://github.com/zhengzaihong/android_work
issue_tracker: https://github.com/zhengzaihong/android_work/issues
topics:
  - android
  - emulator
  - root
  - vpn
  - proxy

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zzh.android_work
        pluginClass: AndroidWorkPlugin
      ios:
        pluginClass: AndroidWorkPlugin
