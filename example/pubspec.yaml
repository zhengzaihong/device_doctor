name: device_doctor_example
description: "Demonstrates how to use the device_doctor plugin (formerly android_work)."
publish_to: 'none'

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  device_doctor:
    path: ../

  cupertino_icons: ^1.0.2
  permission_handler: ^11.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
